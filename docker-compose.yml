version: "3.9"

services:
  # Public REST API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vae-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      - postgres
      - redis
      - jaeger
    networks:
      - vae-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Verification service (library + replay/proof worker)
  verifier:
    build:
      context: .
      dockerfile: apps/verifier/Dockerfile
    container_name: vae-verifier
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=development
    networks:
      - vae-net

  # Settlement worker
  settlement-worker:
    build:
      context: .
      dockerfile: packages/reward/settlement/Dockerfile
    container_name: vae-settlement-worker
    command: ["run"]
    depends_on:
      - postgres
    environment:
      - NODE_ENV=development
    networks:
      - vae-net

  # Data store
  postgres:
    image: postgres:16-alpine
    container_name: vae-postgres
    environment:
      POSTGRES_USER: vae
      POSTGRES_PASSWORD: vae-dev
      POSTGRES_DB: verified_attention
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - vae-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vae"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Message queue (for settlement jobs, replay queue)
  redis:
    image: redis:7-alpine
    container_name: vae-redis
    ports:
      - "6379:6379"
    networks:
      - vae-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Tracing / observability
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: vae-jaeger
    ports:
      - "16686:16686"  # Web UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - vae-net

volumes:
  postgres-data:

networks:
  vae-net:
    driver: bridge
